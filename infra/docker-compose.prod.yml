# The whole platform on one machine.
#
# Five containers: the database, the queue, a one-shot migration, the web app,
# the worker, and Caddy in front holding the certificate. Everything restarts
# by itself, so a reboot at 3am brings the site back without anyone awake.
#
# Run it from the repository root:
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.production up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Deliberately not published to the host. On a public IP a mapped 5432 is a
    # database open to the internet; the other containers reach it over the
    # compose network, which is all anything legitimate needs.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Append-only persistence, because the queue is not a cache. Without it a
    # restart loses every job that was waiting, and those jobs have already
    # been charged for.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: migrate
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: web
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: worker
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # A chain of sixteen clips holds several hundred megabytes of video in
    # temporary files while ffmpeg joins them. Give it room; the default is
    # whatever the host has, which is fine, but this makes the need explicit
    # if the box is ever shared.
    shm_size: "1gb"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:
